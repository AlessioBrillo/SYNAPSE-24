name: CI (the gate is Woodpecker)

# GitHub Actions is NOT the gate of this repository. The single source of truth is
# .woodpecker/ci.yml (check `ci/woodpecker/push/ci`); locally: `ci-local`, or
# `bash scripts/run_gate_locally.sh` on a Windows host (see AGENTS.md, "CI gate").
#
# This workflow used to duplicate the pipeline and had drifted from it (an older ESP-IDF, a
# clang-tidy step that could not fail, a release job publishing a package whose dependency is not
# on PyPI). Two pipelines to keep aligned is how a check ends up green in one and absent in the
# other, so there is one, and this file only says where it is.

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  notice:
    name: Where the gate is
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "The gate is .woodpecker/ci.yml (ci/woodpecker/push/ci), not GitHub Actions."
