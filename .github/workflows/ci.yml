name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.4.0"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run Ruff lint
        run: uv run ruff check .

      - name: Run Ruff format check
        run: uv run ruff format --check .

      - name: Run MyPy type check
        run: uv run mypy --package synapse24 --config-file pyproject.toml

  phase1-dry-run:
    name: Phase 1 Dry-Run Validation
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run Phase 1 dry-run validation
        run: |
          uv run python scripts/validate_phase1_entry.py --config config/hardware_bringup.yaml --dry-run --verbose
        timeout-minutes: 10

      - name: Run Phase 1 dry-run tests
        run: |
          uv run pytest tests/test_phase1_dry_run.py -v
        timeout-minutes: 10

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, phase1-dry-run]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov=src --cov-fail-under=80 --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  triage-model:
    name: Triage Model Training & Quantization
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Train triage model (synthetic for CI)
        run: |
          uv run python scripts/train_triage.py --synthetic --output-dir models/triage --epochs 20
        timeout-minutes: 15

      - name: Quantize and deploy triage model
        run: |
          uv run python scripts/quantize_and_deploy.py --model-dir models/triage --output-dir models/triage/deploy --synthetic --profile triage
        timeout-minutes: 15

      - name: Upload triage model artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-model
          path: |
            models/triage/deploy/*.tflite
            models/triage/deploy/*.h
            models/triage/deploy/*.json
            models/triage/deploy/*.md
            models/triage/deploy/*.cpp
          retention-days: 30

  baseline-validation:
    name: Baseline Validation
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Download WESAD (cached)
        id: wesad-cache
        uses: actions/cache@v4
        with:
          path: data/wesad
          key: wesad-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Download MIT-BIH (cached)
        id: mitbih-cache
        uses: actions/cache@v4
        with:
          path: data/mitbih
          key: mitbih-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Download datasets if not cached
        if: steps.wesad-cache.outputs.cache-hit != 'true' || steps.mitbih-cache.outputs.cache-hit != 'true'
        run: |
          uv run python scripts/download_datasets.py --data-root data --datasets wesad mitbih --max-retries 3 --timeout 300
        timeout-minutes: 30

      - name: Verify dataset integrity
        run: |
          uv run python -c "
            from scripts.download_datasets import verify_all_datasets
            from pathlib import Path
            results = verify_all_datasets(Path('data'))
            for ds, ok in results.items():
                status = 'VERIFIED' if ok else 'MISSING/CORRUPT'
                print(f'{ds}: {status}')
            exit(0 if all(results.values()) else 1)
          "

      - name: Run baseline validation (WESAD + MIT-BIH)
        run: |
          uv run python scripts/validate_baseline.py --dataset both --data-dir data --output-dir data/processed
        timeout-minutes: 45

      - name: Upload validation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-validation
          path: data/processed/*_validation.json
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [test, baseline-validation, triage-model]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}