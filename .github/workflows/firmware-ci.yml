name: Firmware CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'firmware/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'firmware/**'

env:
  ESP_IDF_VERSION: v5.2.1
  TARGET: esp32s3

jobs:
  build-and-test:
    name: Build & Unit Tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [esp32s3]
      fail-fast: false
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          install_tools: true
          setup_path: ${{ runner.temp }}/esp-idf

      - name: Configure project
        working-directory: firmware/esp32_tier0
        run: |
          idf.py set-target ${{ matrix.target }}
          idf.py reconfigure

      - name: Build firmware
        working-directory: firmware/esp32_tier0
        run: |
          idf.py build
        env:
          BUILD_TYPE: release

      - name: Check binary size
        working-directory: firmware/esp32_tier0
        run: |
          idf.py size
          # Extract .data + .bss for RAM usage check
          python3 -c "
import json
import subprocess
result = subprocess.run(['idf.py', 'size', '--format', 'json'], capture_output=True, text=True, cwd='.')
if result.returncode == 0:
    data = json.loads(result.stdout)
    ram_used = data.get('ram', {}).get('used', 0)
    flash_used = data.get('flash', {}).get('used', 0)
    print(f'RAM used: {ram_used/1024:.1f} KB')
    print(f'Flash used: {flash_used/1024:.1f} KB')
    # Quality gate: RAM < 180 KB
    if ram_used > 180 * 1024:
        print('::error::RAM usage exceeds 180 KB limit!')
        exit(1)
    print('✓ RAM usage within limit (< 180 KB)')
"

      - name: Run static analysis (cppcheck)
        working-directory: firmware/esp32_tier0
        run: |
          # Install cppcheck
          sudo apt-get update && sudo apt-get install -y cppcheck
          # Run cppcheck on main source
          cppcheck --enable=all --std=c++17 --suppress=missingIncludeSystem \
            -I main -I main/sensors -I main/scheduler -I main/sync -I main/ble -I main/triage -I main/power \
            --inline-suppr --error-exitcode=1 \
            main/*.cpp main/**/*.cpp 2>&1 | tee cppcheck.log
          if grep -q "error:" cppcheck.log; then
            echo "::error::cppcheck found errors"
            exit 1
          fi
          echo "✓ cppcheck passed (zero defects)"

      - name: Run clang-tidy
        working-directory: firmware/esp32_tier0
        run: |
          # Install clang-tidy
          sudo apt-get install -y clang-tidy
          # Generate compile_commands.json
          idf.py reconfigure 2>&1 | tail -20
          # Run clang-tidy on main sources
          find main -name "*.cpp" -exec clang-tidy -p build --checks='*,-llvm-header-guard,-readability-identifier-naming,-modernize-use-trailing-return-type' {} \; 2>&1 | tee clang_tidy.log
          if grep -q "warning:" clang_tidy.log; then
            echo "::warning::clang-tidy found warnings"
            cat clang_tidy.log
          else
            echo "✓ clang-tidy passed (zero warnings)"
          fi

      - name: Run unit tests (host simulation)
        working-directory: firmware/esp32_tier0
        run: |
          # Build test target
          idf.py -D TEST_BUILD=1 build 2>&1 | tail -30
          # Note: Full hardware tests require target hardware
          # This validates compilation and linking of test code
          echo "✓ Test build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ matrix.target }}-${{ github.run_number }}
          path: |
            firmware/esp32_tier0/build/*.bin
            firmware/esp32_tier0/build/*.elf
            firmware/esp32_tier0/build/flasher_args.json
          retention-days: 30

  size-regression:
    name: Binary Size Regression Check
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}

      - name: Build current PR
        working-directory: firmware/esp32_tier0
        id: build_pr
        run: |
          idf.py set-target ${{ env.TARGET }}
          idf.py build
          python3 -c "
import json, subprocess
result = subprocess.run(['idf.py', 'size', '--format', 'json'], capture_output=True, text=True)
data = json.loads(result.stdout)
ram = data.get('ram', {}).get('used', 0)
flash = data.get('flash', {}).get('used', 0)
print(f'PR_RAM_KB={ram/1024:.1f}')
print(f'PR_FLASH_KB={flash/1024:.1f}')
with open('size_pr.json', 'w') as f:
    json.dump({'ram_kb': ram/1024, 'flash_kb': flash/1024}, f)
          "

      - name: Build base branch
        working-directory: firmware/esp32_tier0
        id: build_base
        run: |
          git stash
          git checkout ${{ github.base_ref }}
          idf.py set-target ${{ env.TARGET }}
          idf.py build
          python3 -c "
import json, subprocess
result = subprocess.run(['idf.py', 'size', '--format', 'json'], capture_output=True, text=True)
data = json.loads(result.stdout)
ram = data.get('ram', {}).get('used', 0)
flash = data.get('flash', {}).get('used', 0)
print(f'BASE_RAM_KB={ram/1024:.1f}')
print(f'BASE_FLASH_KB={flash/1024:.1f}')
with open('size_base.json', 'w') as f:
    json.dump({'ram_kb': ram/1024, 'flash_kb': flash/1024}, f)
          "
          git checkout -
          git stash pop

      - name: Compare sizes
        run: |
          python3 -c "
import json
with open('firmware/esp32_tier0/size_pr.json') as f:
    pr = json.load(f)
with open('firmware/esp32_tier0/size_base.json') as f:
    base = json.load(f)

ram_diff = pr['ram_kb'] - base['ram_kb']
flash_diff = pr['flash_kb'] - base['flash_kb']

print(f'RAM: {base[\"ram_kb\"]:.1f} KB -> {pr[\"ram_kb\"]:.1f} KB ({ram_diff:+.1f} KB)')
print(f'Flash: {base[\"flash_kb\"]:.1f} KB -> {pr[\"flash_kb\"]:.1f} KB ({flash_diff:+.1f} KB)')

# Fail if RAM increase > 5 KB
if ram_diff > 5:
    print(f'::error::RAM increase of {ram_diff:.1f} KB exceeds 5 KB threshold!')
    exit(1)

# Fail if Flash increase > 20 KB
if flash_diff > 20:
    print(f'::error::Flash increase of {flash_diff:.1f} KB exceeds 20 KB threshold!')
    exit(1)

print('✓ Binary size regression check passed')
          "

  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for required documentation
        run: |
          # Verify key firmware docs exist
          required_files=(
            "firmware/esp32_tier0/README.md"
            "firmware/esp32_tier0/main/README.md"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::warning::Missing documentation: $f"
            fi
          done
          echo "✓ Documentation check complete"