name: Firmware CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'firmware/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'firmware/**'

env:
  ESP_IDF_VERSION: v5.2.1
  TARGET: esp32s3

jobs:
  build-and-test:
    name: Build & Unit Tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [esp32_head, esp32_forearm, esp32_band]
      fail-fast: false
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}
          install_tools: true
          setup_path: ${{ runner.temp }}/esp-idf

      - name: Configure project
        working-directory: firmware/${{ matrix.variant }}
        run: |
          idf.py set-target ${{ env.TARGET }}
          idf.py reconfigure

      - name: Build firmware
        working-directory: firmware/${{ matrix.variant }}
        run: |
          idf.py build
        env:
          BUILD_TYPE: release

      - name: Check binary size
        working-directory: firmware/${{ matrix.variant }}
        run: |
          idf.py size
          python3 << 'PYEOF'
          import json
          import subprocess
          result = subprocess.run(['idf.py', 'size', '--format', 'json'], capture_output=True, text=True, cwd='.')
          if result.returncode == 0:
              data = json.loads(result.stdout)
              ram_used = data.get('ram', {}).get('used', 0)
              flash_used = data.get('flash', {}).get('used', 0)
              print(f"RAM used: {ram_used/1024:.1f} KB")
              print(f"Flash used: {flash_used/1024:.1f} KB")
              if ram_used > 180 * 1024:
                  print('::error::RAM usage exceeds 180 KB limit!')
                  exit(1)
              print('RAM usage within limit (< 180 KB)')
          PYEOF

      - name: Run static analysis (cppcheck)
        working-directory: firmware/${{ matrix.variant }}
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          cppcheck --enable=all --std=c++17 --suppress=missingIncludeSystem \
            -I main -I ../../common/sensors -I ../../common/scheduler -I ../../common/sync \
            -I ../../common/ble -I ../../common/triage -I ../../common/power \
            --inline-suppr --error-exitcode=1 \
            main/*.cpp ../../common/**/*.cpp 2>&1 | tee cppcheck.log
          if grep -q "error:" cppcheck.log; then
            echo "::error::cppcheck found errors"
            exit 1
          fi
          echo "cppcheck passed (zero defects)"

      - name: Run clang-tidy
        working-directory: firmware/${{ matrix.variant }}
        run: |
          sudo apt-get install -y clang-tidy
          idf.py reconfigure 2>&1 | tail -20
          find main -name "*.cpp" -exec clang-tidy -p build --checks='*,-llvm-header-guard,-readability-identifier-naming,-modernize-use-trailing-return-type' {} \; 2>&1 | tee clang_tidy.log
          if grep -q "warning:" clang_tidy.log; then
            echo "::warning::clang-tidy found warnings"
            cat clang_tidy.log
          else
            echo "clang-tidy passed (zero warnings)"
          fi

      - name: Run unit tests (host simulation)
        working-directory: firmware/${{ matrix.variant }}
        run: |
          idf.py -D TEST_BUILD=1 build 2>&1 | tail -30
          echo "Test build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ matrix.variant }}-${{ env.TARGET }}-${{ github.run_number }}
          path: |
            firmware/${{ matrix.variant }}/build/*.bin
            firmware/${{ matrix.variant }}/build/*.elf
            firmware/${{ matrix.variant }}/build/flasher_args.json
          retention-days: 30

  size-regression:
    name: Binary Size Regression Check
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.ESP_IDF_VERSION }}

      - name: Build current PR (head)
        working-directory: firmware/esp32_head
        id: build_pr_head
        run: |
          idf.py set-target ${{ env.TARGET }}
          idf.py build
          python3 << 'PYEOF'
          import json, subprocess
          result = subprocess.run(['idf.py', 'size', '--format', 'json'], capture_output=True, text=True)
          data = json.loads(result.stdout)
          ram = data.get('ram', {}).get('used', 0)
          flash = data.get('flash', {}).get('used', 0)
          print(f"PR_RAM_KB={ram/1024:.1f}")
          print(f"PR_FLASH_KB={flash/1024:.1f}")
          with open('size_pr_head.json', 'w') as f:
              json.dump({'ram_kb': ram/1024, 'flash_kb': flash/1024}, f)
          PYEOF

      - name: Build current PR (forearm)
        working-directory: firmware/esp32_forearm
        id: build_pr_forearm
        run: |
          idf.py set-target ${{ env.TARGET }}
          idf.py build
          python3 << 'PYEOF'
          import json, subprocess
          result = subprocess.run(['idf.py', 'size', '--format', 'json'], capture_output=True, text=True)
          data = json.loads(result.stdout)
          ram = data.get('ram', {}).get('used', 0)
          flash = data.get('flash', {}).get('used', 0)
          print(f"PR_RAM_KB={ram/1024:.1f}")
          print(f"PR_FLASH_KB={flash/1024:.1f}")
          with open('size_pr_forearm.json', 'w') as f:
              json.dump({'ram_kb': ram/1024, 'flash_kb': flash/1024}, f)
          PYEOF

      - name: Build current PR (band)
        working-directory: firmware/esp32_band
        id: build_pr_band
        run: |
          idf.py set-target ${{ env.TARGET }}
          idf.py build
          python3 << 'PYEOF'
          import json, subprocess
          result = subprocess.run(['idf.py', 'size', '--format', 'json'], capture_output=True, text=True)
          data = json.loads(result.stdout)
          ram = data.get('ram', {}).get('used', 0)
          flash = data.get('flash', {}).get('used', 0)
          print(f"PR_RAM_KB={ram/1024:.1f}")
          print(f"PR_FLASH_KB={flash/1024:.1f}")
          with open('size_pr_band.json', 'w') as f:
              json.dump({'ram_kb': ram/1024, 'flash_kb': flash/1024}, f)
          PYEOF

      - name: Build base branch (head)
        working-directory: firmware/esp32_head
        id: build_base_head
        run: |
          git stash
          git checkout ${{ github.base_ref }}
          idf.py set-target ${{ env.TARGET }}
          idf.py build
          python3 << 'PYEOF'
          import json, subprocess
          result = subprocess.run(['idf.py', 'size', '--format', 'json'], capture_output=True, text=True)
          data = json.loads(result.stdout)
          ram = data.get('ram', {}).get('used', 0)
          flash = data.get('flash', {}).get('used', 0)
          print(f"BASE_RAM_KB={ram/1024:.1f}")
          print(f"BASE_FLASH_KB={flash/1024:.1f}")
          with open('size_base_head.json', 'w') as f:
              json.dump({'ram_kb': ram/1024, 'flash_kb': flash/1024}, f)
          PYEOF
          git checkout -
          git stash pop

      - name: Build base branch (forearm)
        working-directory: firmware/esp32_forearm
        id: build_base_forearm
        run: |
          git stash
          git checkout ${{ github.base_ref }}
          idf.py set-target ${{ env.TARGET }}
          idf.py build
          python3 << 'PYEOF'
          import json, subprocess
          result = subprocess.run(['idf.py', 'size', '--format', 'json'], capture_output=True, text=True)
          data = json.loads(result.stdout)
          ram = data.get('ram', {}).get('used', 0)
          flash = data.get('flash', {}).get('used', 0)
          print(f"BASE_RAM_KB={ram/1024:.1f}")
          print(f"BASE_FLASH_KB={flash/1024:.1f}")
          with open('size_base_forearm.json', 'w') as f:
              json.dump({'ram_kb': ram/1024, 'flash_kb': flash/1024}, f)
          PYEOF
          git checkout -
          git stash pop

      - name: Compare sizes
        run: |
          python3 << 'PYEOF'
          import json, sys
          for variant in ['head', 'forearm', 'band']:
              try:
                  with open(f'firmware/esp32_{variant}/size_pr_{variant}.json') as f:
                      pr = json.load(f)
                  with open(f'firmware/esp32_{variant}/size_base_{variant}.json') as f:
                      base = json.load(f)
              except FileNotFoundError:
                  print(f'{variant}: size files missing, skipping')
                  continue
              ram_diff = pr['ram_kb'] - base['ram_kb']
              flash_diff = pr['flash_kb'] - base['flash_kb']
              print(f"{variant}: RAM: {base['ram_kb']:.1f} KB -> {pr['ram_kb']:.1f} KB ({ram_diff:+.1f} KB)")
              print(f"{variant}: Flash: {base['flash_kb']:.1f} KB -> {pr['flash_kb']:.1f} KB ({flash_diff:+.1f} KB)")
              if ram_diff > 5:
                  print(f'::error::{variant}: RAM increase of {ram_diff:.1f} KB exceeds 5 KB threshold!')
                  sys.exit(1)
              if flash_diff > 20:
                  print(f'::error::{variant}: Flash increase of {flash_diff:.1f} KB exceeds 20 KB threshold!')
                  sys.exit(1)
          print('Binary size regression check passed for all variants')
          PYEOF

  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for required documentation
        run: |
          # Verify key firmware docs exist
          required_files=(
            "firmware/esp32_head/README.md"
            "firmware/esp32_forearm/README.md"
            "firmware/esp32_band/README.md"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::warning::Missing documentation: $f"
            fi
          done
          echo "Documentation check complete"
