name: Firmware CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'firmware/**'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'firmware/**'

env:
  ESP_IDF_VERSION: v5.2.1
  TARGET: esp32s3

jobs:
  build-and-test:
    name: Build & Unit Tests (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [esp32_head, esp32_forearm, esp32_band]
      fail-fast: false
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: esp-idf-tools-${{ env.ESP_IDF_VERSION }}-${{ runner.os }}

      - name: Install ESP-IDF
        run: |
          if [ ! -d ~/esp-idf ]; then
            git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} https://github.com/espressif/esp-idf.git ~/esp-idf
          fi
          cd ~/esp-idf
          ./install.sh ${{ env.TARGET }}

      - name: Configure project
        working-directory: firmware/${{ matrix.variant }}
        run: |
          . ~/esp-idf/export.sh
          idf.py set-target ${{ env.TARGET }}
          idf.py reconfigure

      - name: Build firmware
        working-directory: firmware/${{ matrix.variant }}
        run: |
          . ~/esp-idf/export.sh
          idf.py build
        env:
          BUILD_TYPE: release

      - name: Check binary size
        working-directory: firmware/${{ matrix.variant }}
        run: |
          . ~/esp-idf/export.sh
          idf.py size

      - name: Run static analysis (cppcheck)
        working-directory: firmware/${{ matrix.variant }}
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          SRCS=$(find . -name "*.c" -o -name "*.cpp" -o -name "*.h" | tr '\n' ' ')
          cppcheck --enable=all --suppress=missingIncludeSystem \
            -I main -I config -I sensors -I acquisition -I signal_quality -I edge_ai \
            -I power -I ble -I fit -I provisioning -I ota \
            -I ../common/sensors -I ../common/scheduler -I ../common/sync \
            -I ../common/ble -I ../common/triage -I ../common/power \
            --inline-suppr --error-exitcode=1 \
            $SRCS 2>&1 | tee cppcheck.log
          if grep -q "error:" cppcheck.log; then
            echo "::error::cppcheck found errors"
            exit 1
          fi
          echo "cppcheck passed (zero defects)"

      - name: Run clang-tidy
        working-directory: firmware/${{ matrix.variant }}
        run: |
          . ~/esp-idf/export.sh
          sudo apt-get install -y clang-tidy
          idf.py reconfigure 2>&1 | tail -20
          find . -name "*.cpp" -not -path "./build/*" -exec clang-tidy -p build --checks='*,-llvm-header-guard,-readability-identifier-naming,-modernize-use-trailing-return-type' {} \; 2>&1 | tee clang_tidy.log
          if grep -q "warning:" clang_tidy.log; then
            echo "::warning::clang-tidy found warnings"
            cat clang_tidy.log
          else
            echo "clang-tidy passed (zero warnings)"
          fi

      - name: Run unit tests (host simulation)
        working-directory: firmware/${{ matrix.variant }}
        run: |
          . ~/esp-idf/export.sh
          idf.py -D TEST_BUILD=1 build 2>&1 | tail -30
          echo "Test build successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-${{ matrix.variant }}-${{ env.TARGET }}-${{ github.run_number }}
          path: |
            firmware/${{ matrix.variant }}/build/*.bin
            firmware/${{ matrix.variant }}/build/*.elf
            firmware/${{ matrix.variant }}/build/flasher_args.json
          retention-days: 30

  size-regression:
    name: Binary Size Report
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        variant: [esp32_head, esp32_forearm, esp32_band]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: esp-idf-tools-${{ env.ESP_IDF_VERSION }}-${{ runner.os }}

      - name: Install ESP-IDF
        run: |
          if [ ! -d ~/esp-idf ]; then
            git clone --depth 1 --branch ${{ env.ESP_IDF_VERSION }} https://github.com/espressif/esp-idf.git ~/esp-idf
          fi
          cd ~/esp-idf
          ./install.sh ${{ env.TARGET }}

      - name: Build and report size
        working-directory: firmware/${{ matrix.variant }}
        run: |
          . ~/esp-idf/export.sh
          idf.py set-target ${{ env.TARGET }}
          idf.py build
          idf.py size
          echo "Size report complete for ${{ matrix.variant }} (informational; fit-in-partition enforced by check_sizes.py at build time)"

  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for required documentation
        run: |
          # Verify key firmware docs exist
          required_files=(
            "firmware/esp32_head/README.md"
            "firmware/esp32_forearm/README.md"
            "firmware/esp32_band/README.md"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::warning::Missing documentation: $f"
            fi
          done
          echo "Documentation check complete"
