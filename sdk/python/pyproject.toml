[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-device"
version = "0.1.0.dev0"
description = "Host SDK for Synapse Band v1: discover, record, stream, export, analyze bio-sensing sessions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "SYNAPSE-24 contributors"},
]
keywords = ["ble", "bio-sensing", "ecg", "ppg", "imu", "fit", "xdf", "lsl"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dependencies = [
    "numpy>=1.26,<2.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=1.10",
]
xdf = [
    "pyxdf>=1.16,<2.0",
]
ble = [
    "bleak>=0.22.0,<1.0",
]
# bleak needs a backend; on Linux use bluez, on Windows/macOS the OS backend is
# built in. The synthetic transport lets tests run without any adapter.

[project.scripts]
synapse = "synapse_device.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["synapse_device"]

[tool.hatch.build]
include = [
    "synapse_device",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W", "C4", "D", "DTZ", "RET", "TRY"]
ignore = [
    "D101", "D102", "D103", "D107",  # missing docstrings (internal modules)
    "ARG001", "ARG002",    # unused callback arguments
    "F841",                 # intentional unused variable
    "PLR2004",              # magic values in protocol constants
    "TRY003",               # long exception messages (detailed error context)
    "TRY300",               # explicit returns
    "RET504",               # unnecessary assignment before return
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]
