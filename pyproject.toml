[project]
name = "synapse-24"
version = "0.1.0"
description = "24/7 multimodal bio-sensing wearable platform — Phase 0: Software & Public Data Foundation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core scientific stack
    "numpy>=1.26.0,<2.0",
    "scipy>=1.13.0,<2.0",
    "pandas>=2.2.0,<3.0",
    "scikit-learn>=1.5.0,<2.0",

    # Biosignal processing
    "neurokit2>=0.2.9,<0.3",
    "mne>=1.8.0,<2.0",
    "biosppy>=2.2.0,<3.0",
    "heartpy>=1.2.6,<2.0",
    "pyhrv>=0.5.0,<1.0",
    "yasa>=0.6.2,<1.0",
    "neurodsp>=2.3.0,<3.0",

    # Data I/O & formats
    "wfdb>=4.2.0,<5.0",
    "pylsl>=1.16.0,<2.0",
    "pyxdf>=1.6.0,<2.0",
    "edfio>=0.3.0,<1.0",

    # Hardware abstraction
    "brainflow>=5.10.0,<6.0",

    # Edge AI / TinyML
    # "edgeimpulse-python>=1.0.0,<2.0",  # Install from Edge Impulse CLI: edge-impulse-linux --setup
    # "tflite-runtime>=2.14.0,<3.0",  # No PyPI wheel for Python 3.12; install from Google or use TFLite from TensorFlow

    # Utilities
    "tqdm>=4.66.0,<5.0",
    "requests>=2.32.0,<3.0",
    "pyyaml>=6.0.0,<7.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-xdist>=3.5.0,<4.0",
    "pytest-mock>=3.14.0,<4.0",
    "hypothesis>=6.100.0,<7.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "types-requests>=2.31.0,<3.0",
    "types-pyyaml>=6.0.0,<7.0",
    "pre-commit>=3.7.0,<4.0",
]
docs = [
    "mkdocs>=1.5.0,<2.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocstrings[python]>=0.25.0,<1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-xdist>=3.5.0,<4.0",
    "pytest-mock>=3.14.0,<4.0",
    "hypothesis>=6.100.0,<7.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "types-requests>=2.31.0,<3.0",
    "types-pyyaml>=6.0.0,<7.0",
    "pre-commit>=3.7.0,<4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "N", "UP", "W", "C4", "C9", "D", "DTZ", "EXE", "ISC", "ICN", "PIE", "PT", "Q", "RET", "SIM", "T20", "TCH", "ARG", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "TID", "PYI",
]
ignore = []
per-file-ignores = { "tests/*" = ["S101", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "NPY002", "PLR2004", "PLC0415", "PTH123", "E501", "T201", "ARG001", "F841", "F401", "RET504", "TRY003"], "scripts/*" = ["T201", "PTH123", "PLC0415", "ARG001", "RET504", "TRY003", "EXE001", "D103", "N806", "PLR2004"] }
format.quote-style = "double"
format.indent-style = "space"
lint.pydocstyle.convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
follow_imports = "silent"
exclude = [
    ".venv",
    "build",
    "dist",
    "site-packages",
]

[[tool.mypy.overrides]]
module = [
    "neurokit2.*",
    "biosppy.*",
    "heartpy.*",
    "pyhrv.*",
    "yasa.*",
    "brainflow.*",
    "pylsl.*",
    "pyxdf.*",
    "wfdb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config -p no:cacheprovider --tb=short --cov-fail-under=80"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "baseline: marks tests that validate against published baselines",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "*/__pycache__/*"]
branch = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

[build-system]
requires = ["hatchling>=1.22.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse24"]