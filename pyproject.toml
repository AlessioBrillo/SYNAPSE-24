[project]
name = "synapse-24"
version = "0.1.0"
description = "24/7 multimodal bio-sensing wearable platform — Phase 0: Software & Public Data Foundation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core scientific stack
    "numpy>=1.26.0,<2.0",
    "scipy>=1.13.0,<2.0",
    "pandas>=2.2.0,<3.0",
    "scikit-learn>=1.5.0,<2.0",

    # Biosignal processing
    "neurokit2>=0.2.9,<0.3",
    "mne>=1.8.0,<2.0",
    "biosppy>=2.2.0,<3.0",
    "heartpy>=1.2.6,<2.0",
    "pyhrv>=0.5.0,<1.0",
    "yasa>=0.6.2,<1.0",
    "neurodsp>=2.3.0,<3.0",

    # Data I/O & formats
    "wfdb>=4.2.0,<5.0",
    "pylsl>=1.16.0,<2.0",
    "pyxdf>=1.6.0,<2.0",
    "edfio>=0.3.0,<1.0",

    # Hardware abstraction
    "brainflow>=5.10.0,<6.0",

    # Edge AI / TinyML
    # "edgeimpulse-python>=1.0.0,<2.0",  # Install from Edge Impulse CLI: edge-impulse-linux --setup
    # "tflite-runtime>=2.14.0,<3.0",  # No PyPI wheel for Python 3.12; install from Google or use TFLite from TensorFlow

    # Utilities
    "tqdm>=4.66.0,<5.0",
    "requests>=2.32.0,<3.0",
    "pyyaml>=6.0.0,<7.0",
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-xdist>=3.5.0,<4.0",
    "pytest-mock>=3.14.0,<4.0",
    "hypothesis>=6.100.0,<7.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "types-requests>=2.31.0,<3.0",
    "types-pyyaml>=6.0.0,<7.0",
    "types-tqdm>=4.24.0,<5.0",
"pre-commit>=3.7.0,<4.0",
    "bleak>=0.22.0,<1.0",
    "esptool>=4.8.0,<5.0",
]
hardware = [
    "bleak>=0.22.0,<1.0",
    "esptool>=4.8.0,<5.0",
    "pylsl>=1.16.0,<2.0",
]
docs = [
    "mkdocs>=1.5.0,<2.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocstrings[python]>=0.25.0,<1.0",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-xdist>=3.5.0,<4.0",
    "pytest-mock>=3.14.0,<4.0",
    "hypothesis>=6.100.0,<7.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "types-requests>=2.31.0,<3.0",
    "types-pyyaml>=6.0.0,<7.0",
    "types-tqdm>=4.70.0.20260827",
    "types-pytz>=2026.3.1.20260727",
    "pre-commit>=3.7.0,<4.0",
    "tensorflow-intel==2.16.1",
    "bleak>=0.22.0,<1.0",
    "esptool>=4.8.0,<5.0",
    "bandit>=1.9.4",
    "pytest-json-report>=1.5.0",
]
hardware = [
    "bleak>=0.22.0,<1.0",
    "esptool>=4.8.0,<5.0",
    "pylsl>=1.16.0,<2.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E", "F", "I", "N", "UP", "W", "C4", "C9", "D", "DTZ", "EXE", "ISC", "ICN", "PIE", "PT", "Q", "RET", "SIM", "T20", "TCH", "ARG", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "TID", "PYI",
    "ISC",  # isort
]
ignore = [
    "D101", "D102", "D103", "D105", "D107", "D212", "D415",  # Missing docstrings (test files, private)
    "ARG001", "ARG002",  # Unused function arguments (callbacks, interface compliance)
    "F841",  # Unused variable (intentional in some patterns)
    "N806",  # Variable in function should be lowercase (legacy constants)
    "PLW1510",  # Unused method (interface stubs)
    "PYI034",  # Missing module stub (third-party libs)
    "TC001", "TC002", "TC003",  # Type checking disabled for some modules
    "T201",  # Direct instantiation of dict/list/set (acceptable)
    "UP037", "UP045",  # Use X | Y instead of Union (Python 3.11 compat)
]
format.quote-style = "double"
format.indent-style = "space"
lint.pydocstyle.convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["synapse24"]
known-third-party = ["numpy", "scipy", "pandas", "sklearn", "neurokit2", "mne", "biosppy", "heartpy", "pyhrv", "yasa", "neurodsp", "wfdb", "pylsl", "pyxdf", "edfio", "brainflow", "tqdm", "requests", "yaml", "pydantic", "pydantic_settings"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
follow_imports = "silent"
exclude = [
    ".venv",
    "build",
    "dist",
    "site-packages",
]

[[tool.mypy.overrides]]
module = [
    "neurokit2.*",
    "brainflow.*",
    "pylsl.*",
    "pyxdf.*",
    "wfdb.*",
    "scipy.*",
    "tensorflow.*",
    "edgeimpulse.*",
    "sklearn.*",
    "flatbuffers.*",
    "mne.*",
    "yasa.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "synapse24.acquisition.*",
    "synapse24.edge_ai.*",
    "synapse24.hardware.*",
    "synapse24.ingestion.sleep_edf",
    "synapse24.ingestion.deap",
    "synapse24.signal_quality.fnirs",
    "synapse24.signal_quality.ppg",
    "synapse24.signal_quality.eeg",
    "synapse24.signal_quality.base",
    "synapse24.signal_quality.ecg",
    "synapse24.utils.xdf",
    "synapse24.ingestion.wesad",
    "synapse24.ingestion.mitbih",
    "synapse24.ingestion.sleep_edf",
    "synapse24.ingestion.deap",
]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config -p no:cacheprovider --tb=short --cov-fail-under=80"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "baseline: marks tests that validate against published baselines",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "scripts/*",
    "*/__pycache__/*",
    "src/synapse24/hardware/*",
    # Integration-heavy acquisition modules (require LSL/hardware)
    "src/synapse24/acquisition/lsl_gateway.py",
    "src/synapse24/acquisition/live_lsl_sync.py",
    "src/synapse24/acquisition/live_validator.py",
]
branch = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

[build-system]
requires = ["hatchling>=1.22.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse24"]
