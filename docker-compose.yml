version: '3.8'

services:
  # Backend API (FastAPI) — SYNAPSE-24 local Data Plane.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONPATH: /app/src:/app
      SYNAPSE_SESSIONS_DIR: /app/data/sessions
      # Optional bearer token: when set, every /api endpoint (except the
      # /api/health liveness probe) requires "Authorization: Bearer <token>".
      SYNAPSE_API_TOKEN: ${SYNAPSE_API_TOKEN:-}
    volumes:
      - ./backend:/app/backend:ro
      - ./worker:/app/worker:ro
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    networks:
      - synapse-network

  # Stateless inference worker. Invoked by Averyn (or manually) with --job and
  # --file; shares the same sessions volume as the backend.
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      - PYTHONPATH=/app/src:/app
      - SYNAPSE_SESSIONS_DIR=/app/data/sessions
    volumes:
      - ./worker:/app/worker:ro
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    networks:
      - synapse-network

  # Frontend Dev Server (Vite) — owned by the Averyn repo, kept here for local dev.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    networks:
      - synapse-network

networks:
  synapse-network:
    driver: bridge
