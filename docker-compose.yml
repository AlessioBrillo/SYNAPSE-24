version: '3.8'

services:
  # Backend API (FastAPI) — SYNAPSE-24 Data Plane.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src:/app
      - SYNAPSE_CONFIG_DIR=/app/config
      - SYNAPSE_SESSIONS_DIR=/app/data/sessions
    volumes:
      - ./backend:/app/backend:ro
      - ./src:/app/src:ro
      - ./worker:/app/worker:ro
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - synapse-network

  # Frontend Dev Server (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0
    networks:
      - synapse-network

  # Redis for caching/session (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - synapse-network

volumes:
  redis-data:

networks:
  synapse-network:
    driver: bridge
