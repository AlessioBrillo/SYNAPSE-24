# SYNAPSE-24 Phase 1 Hardware Bringup Overrides
# Extends config/hardware.yaml — only bringup-specific values here
# All base pod/sensor/sync/power/motion/immobility/night config inherited from hardware.yaml
#
# Usage:
#   uv run python scripts/validate_phase1_entry.py --live-hardware --config config/hardware_bringup.yaml
#   uv run python scripts/validate_phase1_entry.py --tier1 --config config/hardware_bringup.yaml

bringup:
  mode: "single_pod"  # "single_pod" | "multi_pod" — Phase 1: forearm_hub only
  target_pod: "forearm_hub"

  # Firmware flashing (ESP32-S3 with triage INT8 model for forearm_hub).
  # Canonical firmware is firmware/esp32_band; band-core builds the smoke-kit
  # rig (ECG+PPG+IMU, no GPS/TMP117/FIT/provisioning/OTA).
  firmware:
    project_dir: "firmware/esp32_band"
    build_variant: "band-core"
    path: "firmware/esp32_band/build/synapse-band.bin"  # Built by the CI firmware-build job
    port: "${SYNAPSE_FOREARM_SERIAL:-COM3}"
    baud: 921600
    flash_mode: "dio"
    flash_freq: "80m"
    flash_size: "8MB"  # DevKitC-1 N8R8 (see docs/hardware/PROCUREMENT.md G1)
    verify_after_flash: true

  # BLE connection overrides for live hardware.
  # UUIDs are the Synapse Research Service (raw samples + sync), declared in
  # config/hardware.yaml and firmware/esp32_band/ble/ble_research_service.h.
  # They are deliberately distinct from the consumer feature-stream service.
  ble:
    address: "${SYNAPSE_FOREARM_BLE:-auto}"  # "auto" = scan for SYNAPSE device
    scan_timeout_s: 10
    connect_timeout_s: 15
    mtu: 247  # Negotiated MTU for higher throughput
    characteristics:
      service: "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C70"
      ecg:  "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C71"
      ppg:  "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C72"
      acc:  "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C73"
      gyro: "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C74"
      mag:  "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C75"
      power: "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C79"
      sync: "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C78"
      # A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C76 (temp) is declared in
      # firmware/esp32_band/ble/ble_research_service.h but unused in band-core:
      # temperature arrives through the consumer feature stream instead.

  # PPG sampling rate for bringup. Matches config/hardware.yaml
  # (sampling_rate.ppg = 50) and the ppg_dsp.c on-device pipeline, which is
  # designed for 50 Hz. 64 Hz previously came from hardware.yaml while the
  # firmware ran 50 Hz; the contract checker now forbids that split.
  ppg_bringup_sampling_rate_hz: 50

  # Cerelog ESP-EEG head pod (Tier 1) - additional config beyond hardware.yaml
  cerelog_eeg:
    enabled: false  # Phase 1: forearm_hub only
    connection: "usb"  # "usb" | "ble"
    port: "${SYNAPSE_HEAD_SERIAL:-/dev/ttyUSB0}"
    mac_address: "${SYNAPSE_HEAD_BLE:-auto}"
    impedance_check: true
    impedance_threshold_kohm: 50.0
    impedance_test_duration_s: 5.0

  # LSL stream configuration (extends hardware.yaml streams)
  lsl:
    clock_domain: "local_clock"
    stream_prefix: "SYNAPSE"
    chunk_size: 16
    max_buffered: 1000
    streams:
      # Tier 0 streams (forearm_hub). Rates must equal hardware.yaml
      # sampling_rate.* — enforced by tools/check_contract.py.
      - name: "SYNAPSE_ECG_T0"
        type: "ECG"
        channel_count: 1
        sampling_rate: 500
        channel_format: "float32"
        source_id: "synapse_ecg_t0_001"
        tier: 0
      - name: "SYNAPSE_PPG_T0"
        type: "PPG"
        channel_count: 2  # Red + IR
        sampling_rate: 50
        channel_format: "float32"
        source_id: "synapse_ppg_t0_001"
        tier: 0
      - name: "SYNAPSE_ACC_T0"
        type: "ACC"
        channel_count: 3
        sampling_rate: 50
        channel_format: "float32"
        source_id: "synapse_acc_t0_001"
        tier: 0
      - name: "SYNAPSE_GYRO_T0"
        type: "GYRO"
        channel_count: 3
        sampling_rate: 50
        channel_format: "float32"
        source_id: "synapse_gyro_t0_001"
        tier: 0
      - name: "SYNAPSE_MAG_T0"
        type: "MAG"
        channel_count: 3
        sampling_rate: 50
        channel_format: "float32"
        source_id: "synapse_mag_t0_001"
        tier: 0
      # Power telemetry stream
      - name: "SYNAPSE_Power"
        type: "Power"
        channel_count: 4  # voltage_v, current_ma, power_mw, battery_percent
        sampling_rate: 1
        channel_format: "float32"
        source_id: "synapse_power_001"
        tier: 0
      # Sync markers (highest tier)
      - name: "SYNAPSE_Markers"
        type: "Markers"
        channel_count: 1
        sampling_rate: 0
        channel_format: "string"
        source_id: "synapse_markers_001"
        tier: 1

  # Clock synchronization - override mode for multi-pod
  sync:
    mode: "markers_only"  # Phase 1: markers_only (BLE); T1 needs markers_plus_acc + wired
    # Wired sync GPIO for multi-pod (head_pod <-> forearm_hub) - GPIO 10 (I2C: SDA=GPIO 8, SCL=GPIO 9)
    wired_sync_gpio: 10

  # Motion gate - relaxed for MAX30102 wrist PPG validation
  # Architecture.md §74: "measured-clean signal" - require 5 consecutive clean assessments for wrist
  motion_gate:
    sqi_min: 0.3  # Lowered from 0.5 (hardware.yaml) for wrist PPG
    map_max: 0.5
    required_consecutive_clean: 5  # Increased from 2 for wrist PPG bringup validation

  # Validation parameters (bringup-specific)
  validation:
    duration_s: 60
    phase1_gate: true
    immobility_hold_s: 15
    movement_threshold_g: 1.5
    xdf_output_dir: "data/processed/live_validation"
    xdf_filename_template: "synapse_live_{timestamp}.xdf"
    ground_truth_ecg_path: null

  # Triage model (Edge AI) — binary artifact detection only
  # Promotion logic (rest/movement) handled by Python AcquisitionController
  # using validated immobility + power budget + motion gate
  triage_model:
    path: "models/triage_int8.tflite"
    metadata_path: "models/triage_metadata.json"
    input_shape: [1, 30, 9]
    output_classes: ["clean", "artifact"]  # Binary: artifact gate for T0→T1 promotion
    inference_interval_s: 0.2  # 5Hz inference

  # Power budget tracking (live)
  power_monitor:
    enabled: true
    interval_s: 1.0
    battery_capacity_mah: 3000
    nominal_voltage_v: 3.7
    target_lifetime_h: 24.0

  # Logging
  logging:
    level: "INFO"
    console: true
    file: "logs/hardware_bringup_{timestamp}.log"
    lsl_markers: true