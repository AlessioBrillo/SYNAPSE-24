# SYNAPSE-24 Phase 1 Hardware Bringup Configuration
# Single-pod Tier 0 validation (forearm_hub with ESP32-S3)
# Extends config/hardware.yaml — overrides for live hardware validation
#
# Usage:
#   uv run python scripts/validate_phase1_entry.py --live-hardware --config config/hardware_bringup.yaml

bringup:
  mode: "single_pod"  # "single_pod" | "multi_pod" — Phase 1 validates forearm_hub only
  target_pod: "forearm_hub"

  # Firmware flashing (ESP32-S3 with triage INT8 model)
  firmware:
    path: "firmware/synapse_tier0.bin"  # Built by CI triage-model job
    port: "${SYNAPSE_FOREARM_SERIAL:-COM3}"  # User can override via env
    baud: 921600
    flash_mode: "dio"
    flash_freq: "80m"
    flash_size: "4MB"
    verify_after_flash: true

  # BLE connection
  ble:
    address: "${SYNAPSE_FOREARM_BLE:-auto}"  # "auto" = scan for SYNAPSE device
    scan_timeout_s: 10
    connect_timeout_s: 15
    mtu: 185  # Negotiated MTU for higher throughput
    service_uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
    characteristics:
      ecg: "0000ffe1-0000-1000-8000-00805f9b34fb"  # ECG notifications
      ppg: "0000ffe2-0000-1000-8000-00805f9b34fb"  # PPG notifications (red + IR)
      imu: "0000ffe3-0000-1000-8000-00805f9b34fb"  # IMU notifications (9-axis)

  # Sensor specifications (must match firmware sensor config)
  sensors:
    ecg:
      type: "AD8232"
      fs: 500
      channels: 1
      gain: 1100  # V/V
      adc_bits: 12
      vref_mv: 3300
      lead_off_detection: true
    ppg:
      type: "MAX30102"
      fs: 64
      channels: 2  # red + IR
      led_current_red_ma: 8.2
      led_current_ir_ma: 8.2
      sample_avg: 4
      pulse_width_us: 411
      adc_range: 16384  # nA
    imu:
      type: "ICM-20948"
      fs: 100
      channels: 9  # accel 3 + gyro 3 + mag 3
      accel_fsr_g: 8
      gyro_fsr_dps: 1000
      mag_enabled: true
      dmp_enabled: false  # Raw data only; fusion on host

  # LSL stream configuration
  lsl:
    clock_domain: "local_clock"  # pylsl.local_clock()
    stream_prefix: "SYNAPSE"
    chunk_size: 16  # Samples per push_sample() call
    max_buffered: 1000  # Max samples buffered before drop
    streams:
      - name: "SYNAPSE_ECG_T0"
        type: "ECG"
        channel_count: 1
        sampling_rate: 500
        channel_format: "float32"
        source_id: "synapse_ecg_t0_001"
        tier: 0
      - name: "SYNAPSE_PPG_T0"
        type: "PPG"
        channel_count: 2
        sampling_rate: 64
        channel_format: "float32"
        source_id: "synapse_ppg_t0_001"
        tier: 0
      - name: "SYNAPSE_ACC_T0"
        type: "ACC"
        channel_count: 3
        sampling_rate: 100
        channel_format: "float32"
        source_id: "synapse_acc_t0_001"
        tier: 0
      - name: "SYNAPSE_GYRO_T0"
        type: "GYRO"
        channel_count: 3
        sampling_rate: 100
        channel_format: "float32"
        source_id: "synapse_gyro_t0_001"
        tier: 0
      - name: "SYNAPSE_MAG_T0"
        type: "MAG"
        channel_count: 3
        sampling_rate: 100
        channel_format: "float32"
        source_id: "synapse_mag_t0_001"
        tier: 0

  # Clock synchronization (Architecture.md §92)
  sync:
    mode: "markers_only"  # "markers_only" | "markers_plus_acc" — Phase 1 single-pod uses markers only
    tier_budgets:
      T0:
        max_residual_drift_ms: 10.0
        sync_interval_s: 60.0
      T1:
        max_residual_drift_ms: 1.0
        sync_interval_s: 10.0
    acc_correlation_window_s: 30.0
    min_acc_correlation: 0.7
    # Wired sync GPIO for future multi-pod (head_pod ↔ forearm_hub)
    wired_sync_gpio: 21

  # Power budget (Architecture.md §55-62)
  power_budget:
    hub_battery_mah: 3000
    target_lifetime_h: 24
    reserve_mah: 300
    tier_profiles:
      T0:
        avg_mw: 5.0
        peak_mw: 10.0
        max_duration_h: null
      T1:
        avg_mw: 50.0
        peak_mw: 100.0
        max_duration_h: 10.0
      T2:
        avg_mw: 100.0
        peak_mw: 200.0
        max_duration_h: 0.5

  # Motion gate (Architecture.md §74)
  motion_gate:
    sqi_min: 0.3  # Lowered for MAX30102 wrist PPG validation
    map_max: 0.5
    required_consecutive_clean: 2

  # Validation parameters
  validation:
    duration_s: 60  # Recording duration for Phase 1 gate
    phase1_gate: true
    immobility_hold_s: 15  # Hold arm still for this long to trigger T0→T1
    movement_threshold_g: 1.5  # Accel magnitude to trigger T1→T0
    xdf_output_dir: "data/processed/live_validation"
    xdf_filename_template: "synapse_live_{timestamp}.xdf"
    ground_truth_ecg_path: null  # Optional: path to reference ECG for HR validation

  # Triage model (Edge AI)
  triage_model:
    path: "models/triage_int8.tflite"  # INT8 quantized model from CI
    metadata_path: "models/triage_metadata.json"
    input_shape: [1, 30, 9]  # [batch, window, features] — 30 samples @ 100Hz IMU = 300ms
    output_classes: ["rest", "movement", "artifact"]
    inference_interval_s: 0.3  # Run inference every 300ms

  # Immobility detection (for T0->T1 promotion)
  immobility:
    window_s: 30.0
    accel_threshold_g: 0.02
    required_windows: 10

  # Night window scheduler (not used in single-pod Phase 1, but kept for compatibility)
  night_window:
    sleep_start_hour: 23
    sleep_end_hour: 7
    timezone: "UTC"

  # Logging
  logging:
    level: "INFO"
    console: true
    file: "logs/hardware_bringup_{timestamp}.log"
    lsl_markers: true  # Log sync markers to LSL marker stream