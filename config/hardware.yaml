# SYNAPSE-24 Hardware Configuration — SINGLE SOURCE OF TRUTH
# =====================================================================
# Every rate, pin, UUID and stream name in this project is defined here.
# tools/check_contract.py cross-checks this file against the firmware Kconfig,
# the host LSL outlets and the documentation, and fails CI on any drift.
#
# Governing documents:
#   Architecture.md §33-43 (tiered acquisition), §23-31 (decoupled pod/hub),
#                   §55-62 (compress before transmit), §92 (clock sync)
#   Roadmap.md      §138 (Phase 1: ECG+PPG/IMU at normative rates)
#
# Canonical firmware: firmware/esp32_band (band-core / band-full variants).
# The former esp32_tier0 / esp32_head / esp32_forearm / esp32_headband projects
# are archived (see their DEPRECATED.md); firmware/common/ is the shared library
# and remains active, used by esp32_band and by the host parity tests in
# tests/firmware_host/.
# =====================================================================
#
# Guardian Principle: BLE MACs / serial ports are NEVER hardcoded —
# use ${ENV_VAR} expansion.
#
# Canonical firmware: firmware/esp32_band (band-core / band-full variants).
# The former esp32_tier0 / esp32_head / esp32_forearm apps are archived; the
# shared library firmware/common/ is retained and is used by this firmware.
# =====================================================================

pods:
  - pod_id: "forearm_hub"
    name: "Forearm Hub (Tier 0 Continuous)"
    board_type: "ESP32_BAND"          # firmware/esp32_band
    build_variant: "band-core"        # smoke kit: no GPS/TMP117/FIT/provisioning/OTA
    modalities: ["ecg", "ppg", "imu"]
    tier: 0
    channels:
      ecg: 1
      ppg: 2                          # red + IR
      imu: 9
    # Normative sample rates. These match firmware/esp32_band/config/Kconfig
    # (SYNAPSE_PPG_SAMPLE_RATE=0x00 -> SPO2_SR 50 Hz, SYNAPSE_IMU_ACCEL_ODR_HZ=50)
    # and the host LSL outlets declared below. Do not change one without the
    # other two: that is what check_contract.py enforces.
    sampling_rate:
      ecg: 500
      ppg: 50
      imu: 50
    ble_address: "${SYNAPSE_FOREARM_BLE}"
    serial_port: "${SYNAPSE_FOREARM_SERIAL}"
    placement: "forearm"
    electrode_type: "AgAgCl_snap"
    is_hub: true
    metadata:
      # --- BLE: Synapse Research Service (raw samples, dataset path) ---
      # Distinct from the consumer "feature stream" service. The research
      # service is what Phase 1 hardware validation uses.
      research_service_uuid: "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C70"
      research_characteristics:
        ecg:  "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C71"
        ppg:  "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C72"
        acc:  "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C73"
        gyro: "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C74"
        mag:  "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C75"
        power: "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C79"
        sync: "A1B2C3D4-E5F6-4A7B-8C9D-0E1F2A3B4C78"
      # NOTE: skin temperature is carried by the consumer feature-stream
      # characteristic (synapse_feature_stream_t.temperature), not by the
      # research service. The research service carries the modalities that make
      # up the dataset: ECG, PPG, and the three IMU sub-streams.
      sensors:
        ecg: "AD8232"
        ppg: "MAX30102"
        imu: "ICM-20948"
      ecg_config:
        adc_pin: 1                     # ADC1_CH0 = GPIO1 on the S3 (GPIO36 is octal PSRAM)
        gpio_drdy: 15                  # lead-off (LO+ / LO- combined on the module's LO pin)
        lead_off_plus: 15
        lead_off_minus: null           # single combined line; GPIO34 is octal PSRAM
        vref_mv: 1100
        gain: 1100.0                   # nominal AD8232 breakout gain (100 x ~11) — NOT verified for
                                       # generic clones; see gain_measured below
        gain_measured: null            # bench-calibrated gain (BRINGUP_SOP §4a). Empty
                                       # until the kit is on the desk: the µV scale of
                                       # every ECG SNR claim hangs on this per-rig number.
        format: "s16"                  # see src/synapse24/hardware/raw_codec.py
        lsl_stream: "SYNAPSE_ECG_T0"
      ppg_config:
        i2c_addr: 0x57
        gpio_int: 5
        led_current_red: 0x1F
        led_current_ir: 0x1F
        led_current_green: 0x0F
        sample_rate_reg: 0x00          # SPO2_SR code: 0x00=50Hz 0x01=100Hz 0x02=200Hz 0x03=400Hz
        pulse_width_reg: 0x03          # 411 us
        adc_range_reg: 0x03            # 16384 nA
        format: "s32"                  # 18-bit ADC, needs 32-bit codes
        lsl_stream: "SYNAPSE_PPG_T0"
      imu_config:
        i2c_addr: 0x68
        gpio_int: 6
        accel_range_g: 8
        gyro_range_dps: 500
        accel_odr_hz: 50
        gyro_odr_hz: 50
        format: "s16"
        lsl_streams:
          accel: "SYNAPSE_ACC_T0"
          gyro: "SYNAPSE_GYRO_T0"
          mag: "SYNAPSE_MAG_T0"
      # --- I2C bus: shared by PPG + IMU ---
      # ESP32-S3 has no usable GPIO 21-25 on octal-PSRAM modules; the classic
      # ESP32 21/22 pair must NOT be used.
      i2c:
        port: 0
        sda_gpio: 8
        scl_gpio: 9

  - pod_id: "head_pod"
    name: "Head Pod (Tier 1 High-Density Rest/Sleep)"
    board_type: "CERELOG_ESP_EEG"
    modalities: ["eeg", "fnirs", "ecg_rest"]
    tier: 1
    channels:
      eeg: 8
      fnirs: 8
      ecg_rest: 1
    sampling_rate:
      eeg: 500
      fnirs: 10
      ecg_rest: 500
    ble_address: "${SYNAPSE_HEAD_BLE}"
    serial_port: "${SYNAPSE_HEAD_SERIAL}"
    placement: "fronto-temporal"
    electrode_type: "dry_gold_pin"
    is_hub: false
    metadata:
      sensors:
        eeg: "ADS1299"
        fnirs: "MAX86141"
        ecg: "ADS1299_shared"
      eeg_config:
        n_channels: 8
        montage: "10-20_subset"
        reference: "linked_ears"
      fnirs_config:
        wavelengths: [760, 850]
        source_detector_pairs: 8
        short_channels: 2

  - pod_id: "in_ear_satellite"
    name: "In-Ear Satellite (Tier 0 Continuous EEG)"
    board_type: "EAR_EEG_EARBUD"
    modalities: ["eeg_ear"]
    tier: 0
    channels:
      eeg_ear: 2
    sampling_rate:
      eeg_ear: 250
    ble_address: "${SYNAPSE_EAR_BLE}"
    serial_port: ""
    placement: "in_ear_bilateral"
    electrode_type: "dry_silver"
    is_hub: false
    metadata:
      sensors:
        eeg: "custom_earbud_afe"
      eeg_config:
        n_channels: 2
        montage: "bipolar_ear"
        reference: "ipsilateral_ear"

# ---------------------------------------------------------------------
# BLE transport contract
# ---------------------------------------------------------------------
ble:
  # Consumer feature stream (Averyn / product integration): features only,
  # no raw samples. Mirrors firmware/esp32_band/ble/ble_gatt_server.h (GATT v1).
  # Frame: [version u8][sequence u16 LE][payload...], little-endian,
  #   MTU-3 bytes max, default 1 Hz (cap 10 Hz).
  feature_stream:
    service_uuid: "f9e08ffd-3d34-441f-97a6-1bf0958123f1"
    characteristic_uuid: "db4307e5-6cb3-4152-a0e2-81c3921168e9"
    device_config_uuid: "bf68d647-0d02-479a-8d75-7964a51f332f"
    provisioning_uuid: "4e200cf1-94ac-4d63-a161-a03e5d3bb14a"
    payload_bytes: 23   # sizeof(synapse_feature_stream_t); was documented as 26, never true
    version: 1
    rate_hz: 1
    rate_max_hz: 10
  # --- Consumer contract v2.1 (visualization-first) -----------------------------
  # Same consumer service as v1; NEW characteristics, so v1 stays byte-for-byte
  # frozen (contracts/gatt_v1.json, pinned by sha256 in Averyn) and a v1 client
  # simply never sees them. The layouts below are the single source of truth:
  # tools/generate_contracts.py emits contracts/gatt_v2.json from them, the SDK
  # codec and the firmware encoders are checked against it.
  # 2.1 amends 2.0 BEFORE anyone pinned it (the firmware never ran, Averyn pins v1):
  # motion_artifact added (v1's ppg_map must not be lost), one flags definition for the
  # feature frame and the status, sentinels for stress_level/sport_type, unit and scale per
  # field, display units per stream, set_time on the control point, PPG/POWER loss counters.
  # Types: u8 u16 u32 i16 (little-endian). `na` is the "not available" sentinel:
  # a sentinel is NEVER a measurement, consumers map it to null (not 0).
  # Per field, `unit` + `scale`: physical value = wire integer * scale, in `unit`.
  consumer_v2:
    feature_uuid: "23443aaf-382c-4475-baf8-ea3c59ba1a82"
    status_uuid: "fea798da-b114-47c9-8ec4-265bb358e741"
    stream_metadata_uuid: "07458f36-0a8a-4ad0-8513-41279bb5d981"
    control_point_uuid: "bc560345-f1e9-4bbf-98a7-e545c88c02a1"
    feature_rate_hz: 1
    feature_rate_max_hz: 5
    # ONE definition of the bits, used by the feature frame AND the status record.
    # lead_off and clock_wrapped are reserved (always 0) until the lead-off input is
    # trustworthy and t_dev_ms wraps. `charging` is meaningful only when the POWER bit
    # of sensor_health is set; otherwise the band does not know and the bit is 0.
    flags: {charging: 0, lead_off: 1, transmitting: 2, clock_wrapped: 3}
    sensor_health_bits: {ecg: 0, ppg: 1, imu: 2, temp: 3, power: 4}   # set = the sensor initialised
    stress_levels: {baseline: 0, stress: 1, artifact: 2, unknown: 3}   # 255 (na) = the model did not run
    sport_types: {generic: 0, running: 1, cycling: 2, swimming: 3, sleep: 4}   # 255 (na) = not set
    feature:                         # notify, needs ATT MTU >= bytes + 3
      version: 2
      bytes: 27
      fields:
        - {name: version, type: u8}
        - {name: flags, type: u8}
        - {name: sequence, type: u16}
        - {name: t_dev_ms, type: u32, unit: ms, scale: 1}               # device uptime
        - {name: heart_rate_bpm, type: u16, na: 0xFFFF, unit: bpm, scale: 1}
        - {name: rr_last, type: u16, na: 0xFFFF, unit: s, scale: 0.0009765625}   # 1/1024 s (Bluetooth RR unit)
        - {name: rr_count, type: u8, na: 0xFF}          # RR intervals since the previous frame
        - {name: ppg_sqi, type: u8, na: 0xFF, unit: fraction, scale: 0.003937007874015748}      # 0..254 = 0.0..1.0 (255 is NA, never a value)
        - {name: ecg_quality, type: u8, na: 0xFF, unit: fraction, scale: 0.003937007874015748}  # 0..254 = 0.0..1.0
        - {name: motion_level, type: u8, na: 0xFF, unit: fraction, scale: 0.003937007874015748} # 0..254 = 0.0..1.0
        - {name: stress_level, type: u8, na: 0xFF}      # see stress_levels
        - {name: battery_pct, type: u8, na: 0xFF, unit: percent, scale: 1}
        - {name: temperature_c100, type: i16, na: 0x7FFF, unit: degC, scale: 0.01}
        - {name: rmssd_ms, type: u16, na: 0xFFFF, unit: ms, scale: 1}
        - {name: sdnn_ms, type: u16, na: 0xFFFF, unit: ms, scale: 1}
        - {name: sport_type, type: u8, na: 0xFF}
        - {name: sensor_health, type: u8}               # see sensor_health_bits
        # Probability that the PPG window is motion-corrupted (v1 `ppg_map`); appended so the
        # offsets of the 2.0 fields do not move and a reader that stops at 26 bytes still works.
        - {name: motion_artifact, type: u8, na: 0xFF, unit: fraction, scale: 0.003937007874015748}  # 0..254 = 0.0..1.0
    status:                          # read + notify on change
      version: 1
      bytes: 40
      fields:
        - {name: version, type: u8}
        - {name: tier, type: u8}
        - {name: sensor_health, type: u8}
        - {name: flags, type: u8}                       # same bits as the feature frame
        - {name: mtu, type: u16}
        - {name: uptime_s, type: u32, unit: s, scale: 1}
        - {name: epoch_wraps, type: u16}
        - {name: ring_overflow, type: u32}              # samples lost because a ring was full
        - {name: stale_samples, type: u32}
        - {name: dropped_frames, type: u32}             # raw frames the stack refused
        - {name: read_errors, type: u32}
        - {name: fw_build, type: u32}                   # first 4 bytes of the build hash, 0 = unknown
        - {name: ppg_skipped, type: u32}                # PPG FIFO samples not read in time
        - {name: power_dropped, type: u32}              # POWER telemetry samples dropped
    stream_metadata:                 # read: [count u8] + count * entry
      entry_bytes: 8
      entry_fields:
        - {name: stream_id, type: u8}
        - {name: format, type: u8}                      # raw_frame sample_format code
        - {name: channels, type: u8}
        - {name: unit, type: u8}                        # the unit the WIRE integer is in (see units)
        - {name: rate_hz, type: u16}
        - {name: unit_scale, type: u16}                 # driver value (mV, g, rad/s, uT) * unit_scale = wire integer
      units: {count: 0, uV: 1, mg: 2, mrad_s: 3, cut: 4, milli: 5}   # cut = 0.01 uT; milli = mV/mA/mW/%
      streams:
        # rate: a key of pods[].sampling_rate, or a literal Hz value (POWER is 1 Hz telemetry)
        # display_unit / display_per_wire: what a UI shows and the factor from the wire integer
        # (gyro: wire mrad/s -> dps = 180/pi/1000; mag: wire 0.01 uT -> uT).
        ecg:   {format: 2, channels: 1, unit: uV,      unit_scale: 1000, rate: ecg, channel_names: [ecg],      channel_units: [uV],             display_unit: uV,    display_per_wire: 1}
        ppg:   {format: 3, channels: 2, unit: count,   unit_scale: 1,    rate: ppg, channel_names: [red, ir],  channel_units: [count, count],   display_unit: count, display_per_wire: 1}
        acc:   {format: 2, channels: 3, unit: mg,      unit_scale: 1000, rate: imu, channel_names: [x, y, z],  channel_units: [mg, mg, mg],      display_unit: mg,    display_per_wire: 1}
        gyro:  {format: 2, channels: 3, unit: mrad_s,  unit_scale: 1000, rate: imu, channel_names: [x, y, z],  channel_units: [dps, dps, dps],  display_unit: dps,   display_per_wire: 0.057295779513082325}
        mag:   {format: 2, channels: 3, unit: cut,     unit_scale: 100,  rate: imu, channel_names: [x, y, z],  channel_units: [uT, uT, uT],     display_unit: uT,    display_per_wire: 0.01}
        power: {format: 3, channels: 4, unit: milli,   unit_scale: 1,    rate: 1,   channel_names: [voltage, current, power, battery], channel_units: [mV, mA, mW, percent], display_unit: mixed, display_per_wire: 1}
    control_point:                   # write with response: [opcode u8][args...]
      # start/stop gate the RAW research streams only; the feature and status frames keep flowing
      # and report the state in their `transmitting` flag, so a UI can show "paused". A new
      # connection always starts with the streams running.
      # set_time: [4][epoch_ms u64 LE] sets the band's wall clock (it has no RTC and no network);
      # the phone sends it on every connection. A value before set_time_min_epoch_ms is refused.
      description: "start/stop gate the raw research streams; feature and status keep flowing and report the state; a new connection starts running; set_time gives the band its wall clock"
      opcodes: {start: 1, stop: 2, set_feature_rate: 3, set_time: 4}
      set_time_min_epoch_ms: 1577836800000   # 2020-01-01T00:00:00Z
      errors: {bad_opcode: 1, bad_length: 2, bad_argument: 3}
  # Standard GATT services exposed alongside (nRF Connect / LightBlue usable).
  standard_services:
    heart_rate: "180D"
    battery: "180F"
    device_information: "180A"
  # Device Information characteristics read by Averyn for device->owner binding.
  device_info_chars:
    serial_number: "2A25"
    hardware_revision: "2A27"
  mtu_target: 247
  conn_interval_min_ms: 7.5
  conn_interval_max_ms: 15.0
  supervision_timeout_ms: 2000

# ---------------------------------------------------------------------
# Raw frame wire format (Synapse Research Service)
# Mirrors firmware/common/ble/synapse_raw_frame.h and
# src/synapse24/hardware/raw_codec.py. Protected by tests/test_raw_frame_parity.py.
# ---------------------------------------------------------------------
raw_frame:
  version: 1
  header_bytes: 12
  max_payload_bytes: 244
  # Header layout (little-endian). Byte 11 used to be a reserved field: it now
  # carries the loss counter, so the host learns HOW MUCH it will never see
  # and not only THAT something is missing.
  #   0  version
  #   1  stream_id
  #   2  sequence (uint16, wraps at 65535)
  #   4  timestamp_us (uint32, low 32 bits of the pod clock)
  #   8  flags (bit0: the 32-bit timestamp counter wrapped)
  #   9  sample_count (values, channel-minor)
  #  10  sample_format
  #  11  dropped (samples lost for this stream since the previous transmitted
  #      frame, saturating at 255; 0 = no loss)
  # The sequence number is consumed when a frame is BUILT, not when the
  # notification is accepted, so a frame the BLE stack refuses leaves a hole
  # the host's gap detection can see.
  header_fields:
    version: 0
    stream_id: 1
    sequence: 2
    timestamp_us: 4
    flags: 8
    sample_count: 9
    sample_format: 10
    dropped: 11
  dropped_max: 255
  # bit0: THIS frame's low-32 timestamp is lower than the previous transmitted frame of the same
  # stream, i.e. the 32-bit microsecond counter wrapped in between (every 71.58 min)
  flag_bits: {ts_epoch_wrapped: 0}
  stream_ids:
    ecg: 0x01
    ppg: 0x02
    acc: 0x03
    gyro: 0x04
    mag: 0x05
    temp: 0x06
    power: 0x07
    sync: 0x10
  sample_formats:
    s8: 0x01
    s16: 0x02
    s32: 0x03
  # Estimated BLE bytes/second per stream at the normative rates. The 0.6 kB/s
  # figure that used to live here was only ever true of the PPG stream alone
  # (see tests/test_raw_frame_parity.py::test_ppg_frame_fits_the_ble_energy_budget).
  # Measured/derived raw volume for the whole Tier-0 rig:
  #   ECG  500 Hz x 2 B            = 1000 B/s
  #   PPG   50 Hz x 2ch x 4 B s32   =  400 B/s
  #   IMU   3 sub-streams x 3 x 2 B =  900 B/s (50 Hz each)
  #   aggregate                     ~= 2.3-2.4 kB/s sustained
  # This fits the physical BLE link (MTU 247 + DLE, 7.5-15 ms connection
  # interval: >10 kB/s usable) but it is NOT a 0.6 kB/s system. The budgets
  # below are therefore per-stream, with an aggregate cap for bringup.
  # Architecture.md §55-62 "compress before transmit" (delta encoding etc.)
  # is deferred firmware work with its own gate.
  per_stream_bytes_per_second_budget:
    ecg: 1100
    ppg: 450
    acc: 320
    gyro: 320
    mag: 320
    power: 64
  aggregate_bytes_per_second_budget: 3000

# Sync configuration (Architecture.md §92)
sync:
  tier_budgets:
    T0:
      max_residual_drift_ms: 10.0
      sync_interval_s: 60.0
    T1:
      max_residual_drift_ms: 1.0
      sync_interval_s: 10.0
  acc_correlation_window_s: 30.0
  min_acc_correlation: 0.7
  wired_sync_gpio: 10  # GPIO for hardwired Tier 1 sync marker (head_pod <-> forearm_hub)

# Power budget profiles (Architecture.md §55-62)
power_budget:
  hub_battery_mah: 3000
  target_lifetime_h: 24
  reserve_mah: 300
  tier_profiles:
    T0:
      avg_mw: 5.0
      peak_mw: 10.0
      max_duration_h: null
    T1:
      avg_mw: 50.0
      peak_mw: 100.0
      max_duration_h: 10.0
    T2:
      avg_mw: 100.0
      peak_mw: 200.0
      max_duration_h: 0.5

# Motion gate thresholds (Architecture.md §74, state_machine.py MotionGateConfig)
motion_gate:
  sqi_min: 0.5
  map_max: 0.5
  required_consecutive_clean: 2

# Immobility detection (acquisition/immobility.py)
immobility:
  window_s: 30.0
  accel_threshold_g: 0.02
  required_windows: 10  # 5 minutes at 30s windows

# Night window scheduler (acquisition/night_window.py)
night_window:
  sleep_start_hour: 23
  sleep_end_hour: 7
  timezone: "UTC"
