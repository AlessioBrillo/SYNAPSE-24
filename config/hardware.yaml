# SYNAPSE-24 Hardware Configuration
# Single source of truth for all sensor pod configurations
# Architecture.md §33-43 (tiered acquisition), §23-31 (decoupled pod/hub)
# Roadmap.md §138 (Phase 1: ECG+PPG+IMU at normative rates)
# Guardian Principle: BLE MACs / serial ports NEVER hardcoded — use ${ENV_VAR} expansion

pods:
  - pod_id: "forearm_hub"
    name: "Forearm Hub (Tier 0 Continuous)"
    board_type: "ESP32_TIER0"
    modalities: ["ecg", "ppg", "imu"]
    tier: 0
    channels:
      ecg: 1
      ppg: 2
      imu: 9
    sampling_rate:
      ecg: 500
      ppg: 64
      imu: 100
    ble_address: "${SYNAPSE_FOREARM_BLE}"
    serial_port: "${SYNAPSE_FOREARM_SERIAL}"
    placement: "forearm"
    electrode_type: "AgAgCl_snap"
    is_hub: true
    metadata:
      ble_service_uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
      ble_char_uuid: "0000ffe1-0000-1000-8000-00805f9b34fb"
      lsl_stream_ecg: "SYNAPSE_ECG_T0"
      lsl_stream_ppg: "SYNAPSE_PPG_T0"
      lsl_stream_acc: "SYNAPSE_ACC_T0"
      lsl_stream_gyro: "SYNAPSE_GYRO_T0"
      lsl_stream_mag: "SYNAPSE_MAG_T0"
      sensors:
        ecg: "AD8232"
        ppg: "MAX30102"
        imu: "ICM-20948"
      ecg_config:
        adc_pin: 36
        lead_off_plus: 39
        lead_off_minus: 34
      ppg_config:
        i2c_addr: 0x57
        led_current_red: 0x1F
        led_current_ir: 0x1F
      imu_config:
        i2c_addr: 0x68
        accel_range: 4
        gyro_range: 500

  - pod_id: "head_pod"
    name: "Head Pod (Tier 1 High-Density Rest/Sleep)"
    board_type: "CERELOG_ESP_EEG"
    modalities: ["eeg", "fnirs", "ecg_rest"]
    tier: 1
    channels:
      eeg: 8
      fnirs: 8
      ecg_rest: 1
    sampling_rate:
      eeg: 500
      fnirs: 10
      ecg_rest: 500
    ble_address: "${SYNAPSE_HEAD_BLE}"
    serial_port: "${SYNAPSE_HEAD_SERIAL}"
    placement: "fronto-temporal"
    electrode_type: "dry_gold_pin"
    is_hub: false
    metadata:
      ble_service_uuid: "0000ffe0-0000-1000-8000-00805f9b34fb"
      lsl_stream_eeg: "SYNAPSE_EEG_T1"
      lsl_stream_fnirs: "SYNAPSE_FNIRS_T1"
      lsl_stream_ecg: "SYNAPSE_ECG_T1"
      sensors:
        eeg: "ADS1299"
        fnirs: "MAX86141"
        ecg: "ADS1299_shared"
      eeg_config:
        n_channels: 8
        montage: "10-20_subset"
        reference: "linked_ears"
      fnirs_config:
        wavelengths: [760, 850]
        source_detector_pairs: 8
        short_channels: 2

  - pod_id: "in_ear_satellite"
    name: "In-Ear Satellite (Tier 0 Continuous EEG)"
    board_type: "EAR_EEG_EARBUD"
    modalities: ["eeg_ear"]
    tier: 0
    channels:
      eeg_ear: 2
    sampling_rate:
      eeg_ear: 250
    ble_address: "${SYNAPSE_EAR_BLE}"
    serial_port: ""
    placement: "in_ear_bilateral"
    electrode_type: "dry_silver"
    is_hub: false
    metadata:
      lsl_stream_eeg: "SYNAPSE_EEG_T0_EAR"
      sensors:
        eeg: "custom_earbud_afe"
      eeg_config:
        n_channels: 2
        montage: "bipolar_ear"
        reference: "ipsilateral_ear"

# Sync configuration (Architecture.md §92)
sync:
  tier_budgets:
    T0:
      max_residual_drift_ms: 10.0
      sync_interval_s: 60.0
    T1:
      max_residual_drift_ms: 1.0
      sync_interval_s: 10.0
  acc_correlation_window_s: 30.0
  min_acc_correlation: 0.7
  wired_sync_gpio: 21  # GPIO for hardwired Tier 1 sync marker (head_pod ↔ forearm_hub)

# Power budget profiles (Architecture.md §55-62)
power_budget:
  hub_battery_mah: 3000
  target_lifetime_h: 24
  reserve_mah: 300
  tier_profiles:
    T0:
      avg_mw: 5.0
      peak_mw: 10.0
      max_duration_h: null
    T1:
      avg_mw: 50.0
      peak_mw: 100.0
      max_duration_h: 10.0
    T2:
      avg_mw: 100.0
      peak_mw: 200.0
      max_duration_h: 0.5

# Motion gate thresholds (Architecture.md §74, state_machine.py MotionGateConfig)
motion_gate:
  sqi_min: 0.5
  map_max: 0.5
  required_consecutive_clean: 2

# Immobility detection (acquisition/immobility.py)
immobility:
  window_s: 30.0
  accel_threshold_g: 0.02
  required_windows: 10  # 5 minutes at 30s windows

# Night window scheduler (acquisition/night_window.py)
night_window:
  sleep_start_hour: 23
  sleep_end_hour: 7
  timezone: "UTC"