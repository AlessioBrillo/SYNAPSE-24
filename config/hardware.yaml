  muse_s:
    board_id: "MUSE_S_BOARD"
    n_channels: 11
    sampling_rate: 256
    signal_types:
      0: "eeg"
      1: "eeg"
      2: "eeg"
      3: "eeg"
      4: "ppg"
      5: "acc"
      6: "acc"
      7: "acc"
      8: "gyro"
      9: "gyro"
      10: "gyro"

pods:
  # Forearm Hub (Tier 0): PPG + ECG + IMU + Temp
  # Normative rates: ECG 500Hz, PPG 64Hz, IMU 100Hz
  forearm_001:
    pod_id: "forearm_001"
    name: "SYNAPSE Forearm Hub v1"
    board_type: "ESP32_TIER0"
    modalities: ["PPG", "ECG", "IMU", "Temp"]
    tier: 0
    channels:
      ppg: 2
      ecg: 1
      imu: 9
      temp: 1
    sampling_rates:
      ppg: 64
      ecg: 500
      imu: 100
      temp: 1
    ble_address: "${SYNAPSE_FOREARM_BLE}"
    placement: "forearm"
    electrode_type: "wet_ag_agcl"
    is_hub: true
    metadata:
      battery_mah: 500
      firmware: "synapse_tier0"
      sensors:
        ecg: "AD8232"
        ppg: "MAX30102"
        imu: "ICM-20948"
        temp: "internal"

  # Head Pod (Tier 1): High-density EEG + fNIRS
  head_001:
    pod_id: "head_001"
    name: "SYNAPSE Head Pod v1"
    board_type: "CERELOG_BOARD"
    modalities: ["EEG", "fNIRS"]
    tier: 1
    channels: 16
    sampling_rate: 500
    ble_address: "${SYNAPSE_HEAD_BLE}"
    placement: "frontal_parietal"
    electrode_type: "dry_gold_pin"
    is_hub: false
    metadata:
      battery_mah: 1000
      sensors:
        eeg: "ADS1299 x2"
        fnirs: "MAX86141 x4"

  # In-Ear Pod (Tier 0): Ultra-low-power 1-2ch EEG
  in_ear_001:
    pod_id: "in_ear_001"
    name: "SYNAPSE In-Ear Pod v1"
    board_type: "CUSTOM_BOARD"
    modalities: ["EEG_T0"]
    tier: 0
    channels: 2
    sampling_rate: 250
    ble_address: "${SYNAPSE_INEAR_BLE}"
    placement: "in_ear"
    electrode_type: "dry_gold_pin"
    is_hub: false
    metadata:
      battery_mah: 100
      sensors:
        eeg: "custom_ultra_low_power"

  # Reference: EmotiBit (validated PPG/EDA/IMU/Temp)
  emotibit_ref:
    pod_id: "emotibit_ref"
    name: "EmotiBit Reference"
    board_type: "EMOTIBIT_BOARD"
    modalities: ["PPG", "EDA", "IMU", "Temp"]
    tier: 0
    channels:
      ppg: 3
      eda: 1
      imu: 9
      temp: 1
    sampling_rates:
      ppg: 15
      eda: 15
      imu: 50
      temp: 1
    ble_address: "${SYNAPSE_EMOTIBIT_BLE}"
    placement: "upper_arm"
    electrode_type: "dry_contact"
    is_hub: false
    metadata:
      battery_mah: 500
      validation: "Chen et al. 2024 HardwareX"

  # Reference: Muse S (Tier 0 sleep EEG)
  muse_s_ref:
    pod_id: "muse_s_ref"
    name: "Muse S Reference"
    board_type: "MUSE_S_BOARD"
    modalities: ["EEG_T0", "PPG", "IMU"]
    tier: 0
    channels:
      eeg: 4
      ppg: 1
      imu: 9
    sampling_rates:
      eeg: 256
      ppg: 64
      imu: 50
    ble_address: "${SYNAPSE_MUSE_BLE}"
    placement: "forehead"
    electrode_type: "dry_fabric"
    is_hub: false
    metadata:
      battery_mah: 300
      validation: "Muse SDK"

# Sync configuration
sync:
  tier_budgets:
    T0:
      max_residual_drift_ms: 10.0
      sync_interval_s: 60.0
    T1:
      max_residual_drift_ms: 1.0
      sync_interval_s: 10.0
  acc_corr_window_s: 30.0
  min_acc_correlation: 0.7

# Power budget
power:
  hub_battery_mah: 3000
  pod_battery_mah: 500
  target_lifetime_h: 24
  reserve_mah: 300
  profiles:
    T0:
      avg_mw: 5.0
      peak_mw: 10.0
    T1:
      avg_mw: 50.0
      peak_mw: 100.0
      max_duration_h: 10.0
    T2:
      avg_mw: 100.0
      peak_mw: 200.0
      max_burst_min: 30.0

# Edge AI deployment targets
edge_ai:
  triage_profile:  # ESP32-S3
    max_model_kb: 48
    max_ram_kb: 100
    max_latency_ms: 30
    max_accuracy_drop_pp: 3.0
    target_platform: "ESP32_S3"
  hub_fusion_profile:  # Raspberry Pi 5
    max_model_kb: 200
    max_ram_kb: 350
    max_latency_ms: 120
    max_accuracy_drop_pp: 2.0
    target_platform: "RASPBERRY_PI"