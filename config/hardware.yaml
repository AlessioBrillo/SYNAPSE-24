# SYNAPSE-24 Hardware Configuration
# Load via DeviceRegistry.load_from_yaml()
# 
# Guardian security checklist: BLE MACs / serials never hardcoded.
# ``ble_address`` / ``serial_port`` support ``${ENV_VAR}`` expansion
# (e.g. ``${SYNAPSE_HEAD_BLE}``); unset vars resolve to empty string
# and the pod must be provisioned at deploy time, not in git.

boards:
  synthetic:
    board_id: "SYNTHETIC_BOARD"
    n_channels: 16
    sampling_rate: 500
    signal_types:
      0: "ecg"
      1: "ppg"
      2: "eeg"
      3: "eeg"

  esp32_tier0:
    board_id: "ESP32_TIER0"
    n_channels: 16
    sampling_rate: 500
    signal_types:
      0: "ecg"
      1: "ppg_red"
      2: "ppg_ir"
      3: "acc_x"
      4: "acc_y"
      5: "acc_z"
      6: "gyro_x"
      7: "gyro_y"
      8: "gyro_z"
      9: "mag_x"
      10: "mag_y"
      11: "mag_z"

  cerelog:
    board_id: "CERELOG_BOARD"
    n_channels: 17
    sampling_rate: 250
    signal_types:
      0: "eeg"
      1: "eeg"
      2: "eeg"
      3: "eeg"
      4: "eeg"
      5: "eeg"
      6: "eeg"
      7: "eeg"
      8: "acc"
      9: "acc"
      10: "acc"
      11: "gyro"
      12: "gyro"
      13: "gyro"
      14: "mag"
      15: "mag"
      16: "mag"

  emotibit:
    board_id: "EMOTIBIT_BOARD"
    n_channels: 14
    sampling_rate: 15
    signal_types:
      0: "ppg_green"
      1: "ppg_ir"
      2: "ppg_red"
      3: "eda"
      4: "temp"
      5: "acc"
      6: "acc"
      7: "acc"
      8: "gyro"
      9: "gyro"
      10: "gyro"
      11: "mag"
      12: "mag"
      13: "mag"

  pieeg:
    board_id: "PIEEG_BOARD"
    n_channels: 25
    sampling_rate: 250
    signal_types:
      0: "eeg"
      1: "eeg"
      2: "eeg"
      3: "eeg"
      4: "eeg"
      5: "eeg"
      6: "eeg"
      7: "eeg"
      8: "eeg"
      9: "eeg"
      10: "eeg"
      11: "eeg"
      12: "eeg"
      13: "eeg"
      14: "eeg"
      15: "eeg"
      16: "acc"
      17: "acc"
      18: "acc"
      19: "gyro"
      20: "gyro"
      21: "gyro"
      22: "mag"
      23: "mag"
      24: "mag"

  ganglion:
    board_id: "GANGLION_BOARD"
    n_channels: 13
    sampling_rate: 200
    signal_types:
      0: "eeg"
      1: "eeg"
      2: "eeg"
      3: "eeg"
      4: "acc"
      5: "acc"
      6: "acc"
      7: "gyro"
      8: "gyro"
      9: "gyro"
      10: "mag"
      11: "mag"
      12: "mag"

  cyton:
    board_id: "CYTON_BOARD"
    n_channels: 25
    sampling_rate: 250
    signal_types:
      0: "eeg"
      1: "eeg"
      2: "eeg"
      3: "eeg"
      4: "eeg"
      5: "eeg"
      6: "eeg"
      7: "eeg"
      8: "eeg"
      9: "eeg"
      10: "eeg"
      11: "eeg"
      12: "eeg"
      13: "eeg"
