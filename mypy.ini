[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
show_error_codes = True
pretty = True
follow_imports = silent
disable_error_code = syntax
exclude = 
    .venv
    build
    dist
    site-packages
    site-packages/numpy
    */AppData/Roaming/Python/*/site-packages/numpy
    */AppData/Roaming/Python/*/site-packages

[mypy-numpy.*]
ignore_missing_imports = True
disable_error_code = syntax

[mypy-neurokit2.*]
ignore_missing_imports = True

[mypy-brainflow.*]
ignore_missing_imports = True

[mypy-pylsl.*]
ignore_missing_imports = True

[mypy-pyxdf.*]
ignore_missing_imports = True

[mypy-wfdb.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-tensorflow.*]
ignore_missing_imports = True

[mypy-edgeimpulse.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-flatbuffers.*]
ignore_missing_imports = True

[mypy-mne.*]
ignore_missing_imports = True

[mypy-yasa.*]
ignore_missing_imports = True