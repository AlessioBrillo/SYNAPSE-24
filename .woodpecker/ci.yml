# CI gate (was GitHub ci.yml): ruff, mypy, hardware contract, interface
# contract, phase 1 dry-run, tests cov>=80, onboarding cov>=80, SDK tests,
# format conformance, fail-on-skip firmware host gate and ESP-IDF band build.
# Not included: baseline-validation
# (downloads datasets), triage-model, PyPI release, firmware-ci.yml matrix.
# Local: `ci-local`.
when:
  - event: [push, manual]

environment:
  # The numerical stack must not spawn a process pool: on a 2-core runner the
  # loky workers of scikit-learn can block forever, and the thread explosion
  # turns a 12-minute suite into a 6-hour job.
  - OMP_NUM_THREADS=1
  - MKL_NUM_THREADS=1
  - OPENBLAS_NUM_THREADS=1
  - NUMEXPR_NUM_THREADS=1
  - JOBLIB_START_METHOD=fork

steps:
  - name: python
    image: ghcr.io/astral-sh/uv:python3.11-bookworm
    volumes:
      - ci-uv:/root/.cache/uv
    commands:
      - uv sync --dev --frozen
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy --package synapse24 --config-file pyproject.toml
      - uv run mypy sdk/python/synapse_device --config-file pyproject.toml
      - uv run mypy --explicit-package-bases worker backend --config-file pyproject.toml
      - uv run python tools/check_contract.py --verbose
      # The generated contract artifacts (UUIDs, stream ids, rates) must be in
      # sync with config/hardware.yaml: a stale artifact is a silent drift.
      - uv run python tools/generate_contracts.py --check
      # The interface contract (FIT developer fields, GATT UUIDs, worker
      # payloads): it fails on drift between the firmware, the SDK writer,
      # the export and the worker.
      - uv run python tools/check_interfaces.py
      - uv run python tools/check_baseline_claim.py
      - uv run python scripts/validate_phase1_entry.py --config config/hardware_bringup.yaml --dry-run --verbose
      - uv run --no-sync pytest tests/test_phase1_dry_run.py -v --no-cov
      # Third-party conformance: fitdecode must read the FIT files and pyxdf
      # the XDF ones. A format that only this project can read is not a
      # product format.
      - uv run --no-sync pytest tests/test_format_conformance.py -v --no-cov
      # The device layer has its own suite and its own coverage target: the
      # SDK is a separate package (Apache-2.0) with its own tests.
      # --no-sync: the environment is already synced, and a test step must not
      # reach the network.
      - uv run --no-sync pytest --cov=src --cov=worker --cov=backend --cov-fail-under=80 --cov-report=term-missing tests
      # Second coverage gate, over the device-onboarding tooling only. Measured
      # total is ~84 % (bench_suite 87, device_profile 93, device_config_write
      # 77, factory_calibrate 76, g1_measure 91, calibration_record 94); 80 %
      # leaves headroom without being a rubber stamp. pyproject.toml omits the
      # other, manually invoked scripts so they cannot dilute this number; the
      # validator has its own dry-run and suite gates.
      - uv run --no-sync pytest tests/test_device_profile.py tests/test_bench_suite_truthfulness.py tests/test_g1_measure.py tests/test_factory_calibrate.py tests/test_device_config_write.py tests/test_bench_suite.py --cov=scripts --cov-fail-under=80 --cov-report=term-missing -v
      - uv run --no-sync pytest sdk/python/tests --cov=sdk/python --cov-fail-under=80 --cov-report=term-missing -v
      # Fail closed: a skip of a host-C test (e.g. an OS policy refusing to
      # load the freshly built DLL) must turn the gate red. The wrapper runs
      # the same pytest command with -rs and --json-report, and prints every
      # skip reason before failing.
      - uv run --no-sync python scripts/host_c_gate.py
      # Host-side test of the compiled per-unit configuration JSON parser.
      # Same fail-on-skip rule as the 13-module host-C step above.
      - uv run --no-sync python scripts/host_c_gate.py --group parser

  - name: firmware-band
    image: espressif/idf:v5.5.5
    commands:
      - cd firmware/esp32_band
      - idf.py set-target esp32s3
      - idf.py build                      # band-full (sdkconfig.defaults)
      # fullclean keeps sdkconfig, and SDKCONFIG_DEFAULTS only applies when there is none: without
      # removing it the second build is band-full again. (The variable also used to lack its S.)
      - idf.py fullclean
      - rm -f sdkconfig
      - SDKCONFIG_DEFAULTS="sdkconfig.defaults.core;sdkconfig.defaults" idf.py build  # band-core
      # prove it is the core profile: GPS and FIT storage are off there and on in band-full
      - grep -q "^# CONFIG_SYNAPSE_FEATURE_GPS is not set" sdkconfig
      - grep -q "^# CONFIG_SYNAPSE_FEATURE_FIT_STORAGE is not set" sdkconfig
      # bench image: the smoke-kit profile with the factory shell enabled, so
      # no operator has to run menuconfig before calibrating a unit.
      - idf.py fullclean
      - rm -f sdkconfig
      - SDKCONFIG_DEFAULTS="sdkconfig.defaults.core;sdkconfig.defaults.bench;sdkconfig.defaults" idf.py build
      - grep -q "^CONFIG_SYNAPSE_FACTORY_MODE=y" sdkconfig
      - grep -q "^# CONFIG_SYNAPSE_FEATURE_PROVISIONING is not set" sdkconfig
      # ICM-20948 with AD0 tied high (0x69): the smoke kit must be flashable
      # with either address without editing Kconfig on the bench.
      - idf.py fullclean
      - rm -f sdkconfig
      - SDKCONFIG_DEFAULTS="sdkconfig.defaults.core;sdkconfig.defaults.bench;sdkconfig.defaults.ad0;sdkconfig.defaults" idf.py build
      - grep -q "^CONFIG_SYNAPSE_IMU_I2C_ADDR=0x69" sdkconfig
      - grep -q "^CONFIG_SYNAPSE_BUILD_VARIANT=\"band-bench-ad0\"" sdkconfig
      - grep -q "^CONFIG_SYNAPSE_FACTORY_MODE=y" sdkconfig
      # band-full with the RR feature on: the code behind the flag must keep compiling while it is off
      - idf.py fullclean
      - rm -f sdkconfig
      - SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.rr" idf.py build
      - grep -q "^CONFIG_SYNAPSE_RR_ENABLE=y" sdkconfig
      # product image: the raw research service is compiled but never registered
      - idf.py fullclean
      - rm -f sdkconfig
      - SDKCONFIG_DEFAULTS="sdkconfig.defaults.product;sdkconfig.defaults" idf.py build
      - grep -q "^CONFIG_SYNAPSE_PRODUCT_MODE=y" sdkconfig
      - grep -q "^# CONFIG_SYNAPSE_FACTORY_MODE is not set" sdkconfig
