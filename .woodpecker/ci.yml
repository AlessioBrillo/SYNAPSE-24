# CI gate (was GitHub ci.yml): ruff, mypy, hardware contract, phase 1 dry-run, tests cov>=80,
# firmware host gate and ESP-IDF band build. Not included: baseline-validation (downloads
# datasets), triage-model, PyPI release, firmware-ci.yml matrix. Local: `ci-local`.
when:
  - event: [push, manual]

steps:
  - name: python
    image: ghcr.io/astral-sh/uv:python3.11-bookworm
    volumes:
      - ci-uv:/root/.cache/uv
    commands:
      - uv sync --dev --frozen
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run mypy --package synapse24 --config-file pyproject.toml
      - uv run python tools/check_contract.py --verbose
      - uv run python tools/check_baseline_claim.py
      - uv run python scripts/validate_phase1_entry.py --config config/hardware_bringup.yaml --dry-run --verbose
      - uv run pytest tests/test_phase1_dry_run.py -v --no-cov
      - uv run pytest --cov=src --cov=worker --cov-fail-under=80 --cov-report=term-missing
      - uv run pytest tests/test_research_service_host.py tests/test_raw_frame_parity.py tests/test_firmware_host_loadgate.py tests/test_triage_feature_parity.py tests/test_firmware_ppg_imu_host.py -v --no-cov -p no:cacheprovider

  - name: firmware-band
    image: espressif/idf:v5.5.5
    commands:
      - cd firmware/esp32_band
      - idf.py set-target esp32s3
      - idf.py build                      # band-full (sdkconfig.defaults)
      - idf.py fullclean                  # reset before the core variant
      - SDKCONFIG_DEFAULT="sdkconfig.defaults.core" idf.py build  # band-core
